name: noemd
dataset_name_or_path: xpanceo-team/noemd

model:
  backbone: gemnet
  pretrained_model_name_or_path: xpanceo-team/mattergen-base

conditions:
  bandgap_hse:
    type: scalar
  shg:
    type: scalar
  dn:
    type: scalar

data:
  max_num_atoms: 20
  validation_fraction: 0.1
  split_seed: 42

training:
  max_epochs: 800
  batch_size: 32
  gradient_accumulation: 2
  learning_rate: 1.0e-4

output_dir: runs/noemd

logging:
  wandb:
    project: prisma
