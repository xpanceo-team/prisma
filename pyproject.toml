[build-system]
requires = [
    "setuptools>=61.0.0", 
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-materials"
authors = [
    {name = "Alexander Izyurov", email = "asizyurov@xpanceo.com"}
]
description = "PRISMA: a modular closed-loop framework for crystal generation, ML screening, and DFT validation of AI-designed materials."
readme = "README.md"
license = {file = "LICENSE"}

classifiers = [
    "Development Status :: 1 - Planning",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.11"
dependencies = [
    "pymatgen>=2024.10.3",
    "lightning==2.2.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "datasets>=2.19",
    "huggingface-hub>=0.22",
    "diffusers>=0.33.1",
    "wandb>=0.16",
    "tqdm",
    "torch_geometric",
    "torch_scatter",
    "fairchem-core>=1.4.0,<2.0",
    "mattersim>=1.1.2",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest", "black"]
dft = [
    "ase>=3.28.0",
    "fire>=0.7.1",
    "marimo>=0.23.3",
    "matplotlib>=3.10.9",
    "polars>=1.40.1",
    "pymatgen>=2026.3.23",
    "ruff>=0.15.12",
    "seaborn>=0.13.2",
    "sumo @ git+https://github.com/KorotnevVyacheslav/sumo.git",
]

[tool.setuptools.dynamic]
version = {attr = "crystal_diffusers.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "crystal_diffusers",
    "crystal_diffusers.*",
    "vaspoperator",
    "vaspoperator.*",
]
