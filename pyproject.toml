[build-system]
requires = [
    "setuptools>=61.0.0", 
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-materials"
authors = [
    {name = "Alexander Izyurov", email = "asizyurov@xpanceo.com"}
]
description = "PRISMA: a modular closed-loop framework for crystal generation, ML screening, and DFT validation of AI-designed materials."
readme = "README.md"
license = {file = "LICENSE"}

classifiers = [
    "Development Status :: 1 - Planning",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "pymatgen>=2024.10.3",
    "lightning>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "datasets>=2.19",
    "huggingface-hub>=0.22",
    "diffusers>=0.33.1",
    "accelerate>=1.0",
    "wandb>=0.16",
    "tqdm",
    "loguru>=0.7",
    "torch_geometric>=2.5",
    "torch_scatter>=2.1",
    "torch_sparse>=0.6",
    "e3nn>=0.5,<0.6",
    "scipy",
    "sympy",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest", "black"]
validation = [
    "mattersim>=1.1.2",
    "mace-torch>=0.3.9",
]
pet = [
    "metatensor-torch>=0.7",
    "metatomic-torch>=0.1",
    "metatrain>=2026.1,<2026.3",
]
dft = [
    "ase>=3.28.0",
    "fire>=0.7.1",
    "marimo>=0.23.3",
    "matplotlib>=3.10.9",
    "polars>=1.40.1",
    "pymatgen>=2026.3.23",
    "ruff>=0.15.12",
    "seaborn>=0.13.2",
    "sumo @ git+https://github.com/KorotnevVyacheslav/sumo.git",
]

[tool.setuptools.dynamic]
version = {attr = "prisma.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "prisma",
    "prisma.*",
    "vaspoperator",
    "vaspoperator.*",
]

[tool.setuptools.package-data]
"prisma.backbones" = ["LICENSE.md", "README.md"]
"prisma.backbones.equiformer_v2" = [
    "Jd.pt",
    "LICENSE",
    "README.md",
]
