_target_: crystal_diffusers.models.gnns.equiformer_v2.EquiformerV2Wrapper
# Set both fields if you want to initialize from an OCP checkpoint.
# checkpoint_path: ../equiformer_ckpt/eq2_153M_ec4_allmd.pt
checkpoint_path: null
load_states: false
t_emb_dim: 512
condition_keys: []
original_lattice_update: true
max_atomic_number: 100
max_num_elements: 101
# Atom-type prediction uses invariant l=0 scalar channels only.
atom_emb_dim: 128
edge_emb_dim: 128
use_pbc: true
use_pbc_single: false
regress_forces: true
otf_graph: false
max_neighbors: 20
max_radius: 12.0
num_layers: 20
sphere_channels: 128
attn_hidden_channels: 64
num_heads: 8
attn_alpha_channels: 64
attn_value_channels: 16
ffn_hidden_channels: 128
norm_type: layer_norm_sh
lmax_list: [6]
mmax_list: [3]
grid_resolution: 18
num_sphere_samples: 128
edge_channels: 128
use_atom_edge_embedding: true
share_atom_edge_embedding: false
use_m_share_rad: false
distance_function: gaussian
num_distance_basis: 512
attn_activation: silu
use_s2_act_attn: false
use_attn_renorm: true
ffn_activation: silu
use_gate_act: false
use_grid_mlp: true
use_sep_s2_act: true
alpha_drop: 0.1
drop_path_rate: 0.1
proj_drop: 0.0
weight_init: uniform
enforce_max_neighbors_strictly: true
avg_num_nodes: null
avg_degree: null
use_energy_lin_ref: false
load_energy_lin_ref: false
